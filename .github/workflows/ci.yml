# GitHub Actions is the second CI target; the Woodpecker lanes under
# .woodpecker/ are the first. Both delegate to the same Makefile targets, so
# the two stay in agreement by construction.
name: CI
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: make setup
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Docs (zero warnings)
        run: make docs
