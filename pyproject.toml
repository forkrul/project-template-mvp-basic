[project]
name = "forkrul-mvp-template"
version = "0.1.0"
description = "Minimal, agent-ready Python/uv service skeleton for the forkrul estate"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvp_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
